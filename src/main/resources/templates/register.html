<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Account | CampusOne</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth">
<div class="auth-box">
  <a class="brand link" href="/"><span class="brand-mark">C</span>CampusOne</a>
  <h1>Create Account</h1>
  <p>Register your student credentials to access your personal campus workspace.</p>
  {% set messages = flash_messages %}{% for message in messages %}
  <div class="alert error">{{ message }}</div>
  {% endfor %}
  <form method="POST">
    <input name="name" placeholder="Full Name" required>
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password" required>
    <button class="btn" type="submit">Create Account →</button>
  </form>
  <p>Already registered? <a href="/student/login">🎓 Sign in to Student Portal</a></p>
</div>
<script src="/js/app.js"></script>
</body>
</html>
